name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      # Fresh `npm ci` has no generated Prisma client, and there is no
      # postinstall hook, so generate it before the API can be compiled.
      - name: Generate Prisma client
        run: npm run prisma:generate --workspace @edt/api

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test --workspaces --if-present

      - name: Build apps
        run: npm run build
