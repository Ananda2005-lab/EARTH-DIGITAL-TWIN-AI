$kind: http-request
name: 'Issue an API key'
method: POST
url: '{{baseUrl}}/admin/system/api-keys'
order: 6000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{ownerAccessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
      {
        "name": "Local integration",
        "scopes": [
          "read"
        ],
        "rateLimitPerMinute": 60,
        "expiresInDays": 30
      }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Expected HTTP status", function () { pm.expect(pm.response.code).to.eql(201); });
      if (pm.response.code !== 204) {
        let json;
        pm.test("Response body is valid JSON", function () { json = pm.response.json(); pm.expect(json).to.be.an("object"); });
        pm.test("Response exposes endpoint data", function () { pm.expect(json).to.have.any.keys("data", "status", "message", "id", "items", "tokens"); });
      }
