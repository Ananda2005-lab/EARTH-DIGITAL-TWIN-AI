$kind: http-request
name: 'Rename a conversation'
method: PATCH
url: '{{baseUrl}}/ai/conversations/:id'
order: 6000
pathVariables:
  - key: id
    value: '{{userId}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
      {
        "title": "India climate analysis"
      }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Expected HTTP status", function () { pm.expect(pm.response.code).to.eql(200); });
      if (pm.response.code !== 204) {
        let json;
        pm.test("Response body is valid JSON", function () { json = pm.response.json(); pm.expect(json).to.be.an("object"); });
        pm.test("Response exposes endpoint data", function () { pm.expect(json).to.have.any.keys("data", "status", "message", "id", "items", "tokens"); });
      }
