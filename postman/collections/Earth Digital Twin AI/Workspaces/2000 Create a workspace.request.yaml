$kind: http-request
name: 'Create a workspace'
method: POST
url: '{{baseUrl}}/workspaces'
order: 2000
queryParams:
  - key: page
    value: '1'
  - key: pageSize
    value: '24'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
      {
        "name": "India Risk Workspace",
        "description": "Hazard monitoring",
        "view": {
          "lng": 78.9629,
          "lat": 20.5937,
          "altitude": 4000000,
          "bearing": 0,
          "pitch": 0
        },
        "layers": [],
        "annotations": [],
        "visibility": "private"
      }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Expected HTTP status", function () { pm.expect(pm.response.code).to.eql(201); });
      if (pm.response.code !== 204) {
        let json;
        pm.test("Response body is valid JSON", function () { json = pm.response.json(); pm.expect(json).to.be.an("object"); });
        pm.test("Response exposes endpoint data", function () { pm.expect(json).to.have.any.keys("data", "status", "message", "id", "items", "tokens"); });
      }
