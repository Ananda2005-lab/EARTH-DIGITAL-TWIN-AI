$kind: http-request
name: 'Chat'
method: POST
url: '{{aiServiceUrl}}/v1/chat'
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{aiServiceToken}}'
    disabled: true
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
      {
        "message": "Summarize climate risks for India",
        "context": {
          "location": {
            "name": "India"
          }
        },
        "history": []
      }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Expected HTTP status", function () { pm.expect(pm.response.code).to.eql(200); });
      if (pm.response.code !== 204) {
        let json;
        pm.test("Response body is valid JSON", function () { json = pm.response.json(); pm.expect(json).to.be.an("object"); });
        pm.test("Response exposes endpoint data", function () { pm.expect(json).to.have.any.keys("data", "status", "message", "id", "items", "tokens"); });
      }
