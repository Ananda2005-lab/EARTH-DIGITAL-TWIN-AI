$kind: http-request
name: 'Request a report'
method: POST
url: '{{baseUrl}}/reports'
order: 2000
queryParams:
  - key: page
    value: '1'
  - key: pageSize
    value: '24'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
      {
        "kind": "country",
        "title": "India Climate Risk",
        "target": {
          "id": "IN",
          "name": "India"
        },
        "tone": "analytical",
        "includeCharts": true
      }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Expected HTTP status", function () { pm.expect(pm.response.code).to.eql(202); });
      if (pm.response.code !== 204) {
        let json;
        pm.test("Response body is valid JSON", function () { json = pm.response.json(); pm.expect(json).to.be.an("object"); });
        pm.test("Response exposes endpoint data", function () { pm.expect(json).to.have.any.keys("data", "status", "message", "id", "items", "tokens"); });
      }
