$kind: http-request
name: 'Set a new password with a reset token'
method: POST
url: '{{baseUrl}}/auth/reset-password'
order: 9000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
      {
        "token": "replace-with-reset-token-at-least-20-chars",
        "password": "NewStrongPassword1!",
        "confirmPassword": "NewStrongPassword1!"
      }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Expected HTTP status", function () { pm.expect(pm.response.code).to.eql(200); });
      if (pm.response.code !== 204) {
        let json;
        pm.test("Response body is valid JSON", function () { json = pm.response.json(); pm.expect(json).to.be.an("object"); });
        pm.test("Response exposes endpoint data", function () { pm.expect(json).to.have.any.keys("data", "status", "message", "id", "items", "tokens"); });
      }
