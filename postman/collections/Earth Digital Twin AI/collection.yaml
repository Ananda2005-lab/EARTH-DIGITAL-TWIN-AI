$kind: collection
name: Earth Digital Twin AI
description: 'Complete local API and direct AI service request suite derived from project controllers and schemas.'
variables:
  - key: baseUrl
    value: 'http://localhost:4000/api/v1'
  - key: aiServiceUrl
    value: 'http://localhost:8000'
scripts:
  - type: http:beforeRequest
    language: text/javascript
    code: |-
      if (!pm.environment.get("maxResponseTime")) pm.environment.set("maxResponseTime", "5000");
  - type: http:afterResponse
    language: text/javascript
    code: |-
      const max = Number(pm.variables.replaceIn("{{maxResponseTime}}")) || 5000;
      pm.test("Response time is within limit", () => pm.expect(pm.response.responseTime).to.be.below(max));
      const hasBody = pm.response.code !== 204 && pm.response.text().trim().length > 0;
      if (hasBody) {
        pm.test("Body responses use JSON Content-Type", () => pm.expect(pm.response.headers.get("Content-Type") || "").to.include("application/json"));
        let json; try { json = pm.response.json(); } catch (_) {}
        if (json && pm.response.code >= 200 && pm.response.code < 300) {
          pm.test("Successful API response uses data/meta envelope or documented raw shape", () => {
            const raw = ["/health", "/auth/oauth/", "/reports/"].some(p => pm.request.url.toString().includes(p));
            if (!raw) pm.expect(json).to.have.property("data");
            if (json.data !== undefined) pm.expect(json).to.have.property("meta");
          });
        }
        if (json && pm.response.code >= 400) {
          const e = json.error || json.data || json;
          pm.test("Failure has standard error fields", () => ["statusCode","code","message","path","requestId","timestamp"].forEach(k => pm.expect(e).to.have.property(k)));
        }
      }
