$kind: http-request
name: 'Malformed coordinates'
method: GET
url: '{{baseUrl}}/search'
order: 1000
queryParams:
  - key: q
    value: India
  - key: near
    value: 'not-coordinates'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Expected HTTP status", function () { pm.expect(pm.response.code).to.eql(400); });
      if (pm.response.code !== 204) {
        let json;
        pm.test("Response body is valid JSON", function () { json = pm.response.json(); pm.expect(json).to.be.an("object"); });
        pm.test("Response exposes endpoint data", function () { pm.expect(json).to.have.any.keys("data", "status", "message", "id", "items", "tokens"); });
      }
