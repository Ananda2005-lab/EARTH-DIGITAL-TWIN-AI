# Earth Digital Twin AI — single reverse-proxy entry point.
# Serves the Next.js app and forwards API calls to the NestJS gateway so a
# browser only ever talks to one origin (no CORS issues).

upstream edt_web {
  server web:3000;
}

upstream edt_api {
  server api:4000;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 20m;

  # API traffic goes straight to the Nest gateway (keeps the /api prefix,
  # which the gateway already serves as /api/v1/...).
  location /api/ {
    proxy_pass http://edt_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Everything else goes to Next.js (SSR + static assets).
  location / {
    proxy_pass http://edt_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
