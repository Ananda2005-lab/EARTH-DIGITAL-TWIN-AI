# Local development dependencies only.
#
# The credentials below are deliberately trivial and must never be reused for a
# deployed environment. Ports bind to 127.0.0.1 so nothing is reachable from the
# network even if the host firewall is open.
name: earth-digital-twin

services:
  postgres:
    # PostGIS is required: the schema declares postgis, pgcrypto and pg_trgm, and
    # the 0001_init migration creates all three.
    image: postgis/postgis:16-3.4
    container_name: edt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: edt
      POSTGRES_PASSWORD: edt_local_dev
      POSTGRES_DB: edt
      # Deterministic collation keeps trigram search ordering stable across hosts.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      # Host port shifted off 5432 since other local projects already bind it.
      - '127.0.0.1:5435:5432'
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U edt -d edt']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: edt-redis
    restart: unless-stopped
    # Cache and queue share the instance; AOF keeps queued jobs across restarts.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      # Host port shifted off 6379 since other local projects already bind it.
      - '127.0.0.1:6382:6379'
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
